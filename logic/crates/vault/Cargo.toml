[package]
name = "household-vault-vault"
version = "0.1.0"
edition = "2021"

[lib]
# `cdylib` for the WASM artifact the bundle ships; `rlib` so the in-process
# `TestHost` unit tests and the `tests/converge.rs` integration binary can link
# the crate as a normal Rust library.
crate-type = ["cdylib", "rlib"]

[dependencies]
household-vault-types = { workspace = true }
calimero-sdk = { workspace = true }
calimero-storage = { workspace = true }
calimero-storage-macros = { workspace = true }
bs58 = { workspace = true }

[build-dependencies]
calimero-wasm-abi = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Enables `register_crdt_merge` + the native mock host so `TestHost` can drive
# CRDT state under `cargo test`. No `tests/converge.rs` here: the vault's only
# collection is `AuthoredMap`, whose signed-delta merge path the bare
# `converge_app` harness cannot reconcile (see the AuthoredMap docs) — author
# gating is covered by the `call_as` unit tests in `src/lib.rs` instead.
calimero-storage = { workspace = true, features = ["testing"] }
