[package]
name = "split-circle-group"
version = "0.1.0"
edition = "2021"

[lib]
# `cdylib` for the WASM artifact the bundle ships; `rlib` so the in-process
# `TestHost` unit tests can link the crate as a normal Rust library.
crate-type = ["cdylib", "rlib"]

[dependencies]
split-circle-types = { workspace = true }
calimero-sdk = { workspace = true }
calimero-storage = { workspace = true }
calimero-storage-macros = { workspace = true }
bs58 = { workspace = true }

[build-dependencies]
calimero-wasm-abi = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Enables `register_crdt_merge` + the native mock host so `TestHost` can drive
# CRDT state under `cargo test`. No `tests/converge.rs` here: every top-level
# state field is an `AuthoredMap`/`SharedStorage`, whose per-entry merge runs
# on the signed-delta path that the bare `converge_app` harness (no signing
# identity) cannot reconcile — see `get_calimero_patterns("shared-storage")`.
calimero-storage = { workspace = true, features = ["testing"] }
