[package]
name = "incidentflow-incident-tracker"
version = "0.1.0"
edition = "2021"

[lib]
# `cdylib` for the WASM artifact the bundle ships; `rlib` so the in-process
# `TestHost` unit tests and the `tests/converge.rs` integration binary can link
# the crate as a normal Rust library.
crate-type = ["cdylib", "rlib"]

[dependencies]
incidentflow-types = { workspace = true }
calimero-sdk = { workspace = true }
calimero-storage = { workspace = true }
calimero-storage-macros = { workspace = true }
bs58 = { workspace = true }

[build-dependencies]
calimero-wasm-abi = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Enables `register_crdt_merge` + the native mock host so `TestHost` can drive
# CRDT state under `cargo test`. No `tests/converge.rs` here: every collection
# is either a plain `UnorderedMap` of a `#[derive(Mergeable)]` value (the
# storage layer's own derive-generated merge covers convergence) or an
# `AuthoredMap` (unreconcilable in the bare, signing-less converge harness).
calimero-storage = { workspace = true, features = ["testing"] }
