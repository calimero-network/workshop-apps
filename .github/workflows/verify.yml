# Managed by Calimero Studio (P2). Deterministic verify gate — do not
# hand-edit; the builder overwrites this on every verify.
name: verify

on:
  push:
    branches:
      # Must cover EVERY branch prefix buildBranchName can emit:
      #   workshop/<user>/<slug>  (workshop/prod users, userId != 'dev')
      #   ai-builder/<slug>        (local dev, userId == 'dev')
      # A mismatch here = the workflow never fires → the worker polls a
      # check that never exists ("waiting for actions, none run").
      - 'workshop/**'
      - 'ai-builder/**'

# A heal push supersedes the prior run for the same branch.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

# Job id is 'gate' (not 'verify') so the ONLY check named `verify` is
# the explicit one the publish step creates — the worker keys off it.
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Rust toolchain (wasm32)
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-src || true

      - name: Install merobox
        run: pipx install merobox || pip install --user merobox

      # ── ACQUIRE MEROD (native, no Docker) ──────────────────────────
      # Prebuilt release from calimero-network/core. Pre-launch: track
      # the LATEST RC (newest prerelease) by default; pin via the
      # repo/org Actions variable MEROD_VERSION when needed.
      - name: Resolve merod version
        id: merodver
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ vars.MEROD_VERSION }}
        run: |
          set -euo pipefail
          if [ -n "${PINNED:-}" ]; then
            ver="$PINNED"
          else
            ver="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              'https://api.github.com/repos/calimero-network/core/releases?per_page=30' \
              | jq -r '[ .[] | select(.prerelease==true)
                          | select(any(.assets[].name; .=="merod_x86_64-unknown-linux-gnu.tar.gz")) ]
                        | .[0].tag_name')"
          fi
          test -n "$ver" && test "$ver" != "null"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "merod version: $ver"
      - name: Cache merod
        id: merod-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/merod
          key: merod-${{ steps.merodver.outputs.version }}-x86_64-linux
      - name: Download merod
        if: steps.merod-cache.outputs.cache-hit != 'true'
        env:
          MEROD_VERSION: ${{ steps.merodver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/merod"
          url="https://github.com/calimero-network/core/releases/download/${MEROD_VERSION}/merod_x86_64-unknown-linux-gnu.tar.gz"
          echo "Downloading $url"
          curl -fsSL "$url" -o /tmp/merod.tgz
          tar -xzf /tmp/merod.tgz -C "$HOME/.local/merod"
          # Asset layout varies (binary at root or nested) — locate it.
          merod_bin="$(find "$HOME/.local/merod" -type f -name merod | head -n1)"
          test -n "$merod_bin"
          chmod +x "$merod_bin"
          ln -sf "$merod_bin" "$HOME/.local/merod/merod"
      - name: Put merod on PATH
        run: |
          echo "$HOME/.local/merod" >> "$GITHUB_PATH"
          echo "MEROD_BINARY=$HOME/.local/merod/merod" >> "$GITHUB_ENV"
      - name: merod sanity
        run: merod --version || merod --help | head -1

      # bundle / validate / smoke / e2e are all continue-on-error so a
      # hard failure never skips later steps — the final "Publish verify
      # check" step is the SINGLE source of truth for the conclusion
      # (a skipped step would otherwise be misread as "did not fail").
      - name: Build dev bundle (.mpk)
        id: bundle
        continue-on-error: true
        run: |
          set -o pipefail
          if [ -f logic/build-bundle.sh ]; then
            bash logic/build-bundle.sh 2>&1 | tee -a verify-out.txt
          else
            echo "no logic/build-bundle.sh — skipping bundle build" | tee -a verify-out.txt
          fi

      # Schema gate FIRST (the validateMeroboxWorkflows gate): a bad
      # step type / missing field is a pure workflow-file problem.
      - name: merobox validate
        id: mvalidate
        continue-on-error: true
        run: |
          set -o pipefail
          if [ -f test/spec-smoke.workflow.yml ]; then
            merobox bootstrap validate test/spec-smoke.workflow.yml 2>&1 | tee -a verify-out.txt
          else
            echo "no test/spec-smoke.workflow.yml — nothing to validate" | tee -a verify-out.txt
          fi

      - name: merobox smoke (two-node, native merod --no-docker)
        id: msmoke
        continue-on-error: true
        run: |
          set -o pipefail
          if [ -f test/spec-smoke.workflow.yml ]; then
            merobox bootstrap run --no-docker --binary-path "$MEROD_BINARY" \
              test/spec-smoke.workflow.yml 2>&1 | tee -a verify-out.txt
          else
            echo "no smoke workflow — merobox stage skipped" | tee -a verify-out.txt
          fi

      - name: Playwright e2e
        id: e2e
        # Non-blocking unless STRICT_E2E_GATE — mirrors the in-worker
        # default. The conclusion logic below honours this.
        continue-on-error: true
        run: |
          set -o pipefail
          if ls app/e2e/*.spec.ts >/dev/null 2>&1; then
            cd app
            pnpm install --no-frozen-lockfile 2>&1 | tee -a ../verify-out.txt
            npx playwright install --with-deps chromium 2>&1 | tee -a ../verify-out.txt
            npx playwright test --reporter=line 2>&1 | tee -a ../verify-out.txt
          else
            echo "no app/e2e/*.spec.ts — Playwright skipped" | tee -a verify-out.txt
          fi

      - name: Upload verify logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: verify-out.txt
          if-no-files-found: ignore

      # Publish the `verify` check with a stage marker + failing tail
      # the worker's verify-heal consumes.
      - name: Publish verify check
        if: always()
        uses: actions/github-script@v7
        env:
          STRICT_E2E_GATE: ${{ vars.STRICT_E2E_GATE }}
        with:
          script: |
            const fs = require('fs');
            const out = fs.existsSync('verify-out.txt') ? fs.readFileSync('verify-out.txt', 'utf8') : '';
            const tail = out.slice(-60000);
            const bundleFailed = ${{ steps.bundle.outcome == 'failure' }};
            const meroboxFailed = bundleFailed || ${{ steps.mvalidate.outcome == 'failure' || steps.msmoke.outcome == 'failure' }};
            const e2eFailed = ${{ steps.e2e.outcome == 'failure' }};
            const strict = String(process.env.STRICT_E2E_GATE || '').toLowerCase() === 'true';
            const failed = meroboxFailed || (strict && e2eFailed);
            const stage = meroboxFailed ? 'merobox' : (e2eFailed ? 'e2e' : 'none');
            const conclusion = failed ? 'failure' : (e2eFailed ? 'neutral' : 'success');
            const summary = [
              'stage=' + stage,
              'merobox=' + (meroboxFailed ? 'fail' : 'ok'),
              'e2e=' + (e2eFailed ? (strict ? 'fail' : 'fail(non-blocking)') : 'ok'),
            ].join(' ');
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'verify',
              head_sha: context.sha,
              status: 'completed',
              conclusion,
              output: {
                title: 'Calimero verify',
                summary,
                text: tail,
              },
            });
            if (failed) core.setFailed('verify gate failed (' + stage + ')');
