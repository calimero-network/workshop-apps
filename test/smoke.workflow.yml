# Two-node smoke test for the incidentflow / incident-tracker service.
#
# Exercises the parts the in-process TestHost / converge harness can't cover,
# end-to-end on real nodes:
#   - the `incident-tracker` crate installed + a context created for it from
#     the incidentflow bundle
#   - Incident / Comment / Postmortem state replicating across two peers
#   - the full incident lifecycle: report -> status update -> assignment ->
#     comment -> postmortem draft -> postmortem publish
#
# Usage (run from the chat project root, after a dev bundle has been built):
#   merobox bootstrap run test/smoke.workflow.yml
#
# Pre-flight: `bash logic/build-bundle.sh` must have produced
# `logic/res/incidentflow-1.0.0.mpk` (appName/appVersion from studio.config.json).

name: Incidentflow incident-tracker smoke
description: Verify the incident-tracker service replicates incidents, comments, and postmortems across two nodes.
log_level: info
nodes:
  count: 2
  prefix: foundation-node
  # ponytail: pinned off `:edge` to the rc.8-matching tag so the verify merod
  # matches the SDK the logic pins (0.11.0-rc.11). Bump in lockstep with
  # logic/Cargo.toml's SDK tag, or bootstrap skews. ASSUMPTION: ghcr publishes
  # an image tag matching the core git tag `0.11.0-rc.11`; if the registry uses a
  # different naming scheme, correct this tag (and verifierWorkflow.js).
  image: ghcr.io/calimero-network/merod:0.11.0-rc.11
  # High base ports to avoid colliding with a host-native merod on the
  # defaults (2428 P2P / 2528 RPC). Each node gets base + i.
  base_port: 12428      # P2P / swarm
  base_rpc_port: 12528  # JSON-RPC / admin API
nuke_on_start: true
nuke_on_end: true
wait_timeout: 90

steps:
  # --- Bootstrap application + namespace ---

  - type: install_application
    name: Install incidentflow bundle on node 1
    node: foundation-node-1
    dev: true
    path: ./logic/res/incidentflow-1.0.0.mpk
    outputs:
      app_id: applicationId

  - type: install_application
    name: Install incidentflow bundle on node 2
    node: foundation-node-2
    dev: true
    path: ./logic/res/incidentflow-1.0.0.mpk

  - type: create_namespace
    name: Create namespace on node 1
    node: foundation-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - type: create_context
    name: Create incident-tracker context on node 1
    node: foundation-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    service_name: incident-tracker
    outputs:
      incident_tracker_ctx: contextId

  - type: create_namespace_invitation
    name: Issue namespace invitation
    node: foundation-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation: invitation

  - type: join_namespace
    name: Node 2 joins namespace
    node: foundation-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation}}'

  # --- create_incident replicates across peers ---

  - type: call
    name: Node 1 creates an incident
    node: foundation-node-1
    context_id: '{{incident_tracker_ctx}}'
    method: create_incident
    args:
      title: "Checkout down"
      description: "500s on checkout API"
      severity: "Critical"
      affected_area: "Payments"
    outputs:
      incident_id: result.output

  - type: wait_for_sync
    name: Wait for the incident to sync across both nodes
    context_id: '{{incident_tracker_ctx}}'
    nodes: [foundation-node-1, foundation-node-2]
    timeout: 30
    trigger_sync: true

  - type: call
    name: List incidents from node 2
    node: foundation-node-2
    context_id: '{{incident_tracker_ctx}}'
    method: list_incidents
    args: {}
    outputs:
      incident_0_on_n2: result.output.0

  - type: json_assert
    name: Node 2 sees the incident node 1 created
    statements:
      - 'json_subset({{incident_0_on_n2}}, {"title": "Checkout down", "severity": "Critical", "affected_area": "Payments"})'

  # --- update_status ---

  - type: call
    name: Exercise update_status on node 1
    node: foundation-node-1
    context_id: '{{incident_tracker_ctx}}'
    method: update_status
    args:
      incident_id: '{{incident_id}}'
      status: "Mitigating"

  - type: wait_for_sync
    name: Wait for the status update to sync
    context_id: '{{incident_tracker_ctx}}'
    nodes: [foundation-node-1, foundation-node-2]
    timeout: 30
    trigger_sync: true

  - type: call
    name: Confirm status update visible on node 2
    node: foundation-node-2
    context_id: '{{incident_tracker_ctx}}'
    method: list_incidents
    args: {}
    outputs:
      incident_0_after_status: result.output.0

  - type: json_assert
    name: update_status produced Mitigating on node 2
    statements:
      - 'json_subset({{incident_0_after_status}}, {"status": "Mitigating"})'

  # --- assign_incident ---

  - type: call
    name: Exercise assign_incident on node 1
    node: foundation-node-1
    context_id: '{{incident_tracker_ctx}}'
    method: assign_incident
    args:
      incident_id: '{{incident_id}}'
      assignee: "alice"

  - type: wait_for_sync
    name: Wait for the assignment to sync
    context_id: '{{incident_tracker_ctx}}'
    nodes: [foundation-node-1, foundation-node-2]
    timeout: 30
    trigger_sync: true

  - type: call
    name: Confirm assignment visible on node 2
    node: foundation-node-2
    context_id: '{{incident_tracker_ctx}}'
    method: list_incidents
    args: {}
    outputs:
      incident_0_after_assign: result.output.0

  - type: json_assert
    name: assign_incident produced alice as assignee on node 2
    statements:
      - 'json_subset({{incident_0_after_assign}}, {"assigned_to": "alice"})'

  # --- add_comment ---

  - type: call
    name: Exercise add_comment on node 1
    node: foundation-node-1
    context_id: '{{incident_tracker_ctx}}'
    method: add_comment
    args:
      incident_id: '{{incident_id}}'
      body: "Rolling back deploy"
      mentions: ["bob"]
    outputs:
      comment_id: result.output

  - type: wait_for_sync
    name: Wait for the comment to sync
    context_id: '{{incident_tracker_ctx}}'
    nodes: [foundation-node-1, foundation-node-2]
    timeout: 30
    trigger_sync: true

  - type: call
    name: Confirm comment visible on node 2
    node: foundation-node-2
    context_id: '{{incident_tracker_ctx}}'
    method: list_comments
    args:
      incident_id: '{{incident_id}}'
    outputs:
      comment_0: result.output.0

  - type: json_assert
    name: add_comment produced a visible Comment on node 2
    statements:
      - 'json_subset({{comment_0}}, {"body": "Rolling back deploy", "mentions": ["bob"]})'

  # --- create_postmortem ---

  - type: call
    name: Exercise create_postmortem on node 1
    node: foundation-node-1
    context_id: '{{incident_tracker_ctx}}'
    method: create_postmortem
    args:
      incident_id: '{{incident_id}}'
      summary: "Checkout outage 45min"
      root_cause: "Bad deploy"
      resolution_steps: "Rolled back"
      lessons_learned: "Add canary tests"
    outputs:
      postmortem_id: result.output

  - type: wait_for_sync
    name: Wait for the postmortem to sync
    context_id: '{{incident_tracker_ctx}}'
    nodes: [foundation-node-1, foundation-node-2]
    timeout: 30
    trigger_sync: true

  - type: call
    name: Confirm draft postmortem visible on node 2
    node: foundation-node-2
    context_id: '{{incident_tracker_ctx}}'
    method: list_postmortems
    args: {}
    outputs:
      postmortem_0: result.output.0

  - type: json_assert
    name: create_postmortem produced a draft postmortem visible on node 2
    statements:
      - 'json_subset({{postmortem_0}}, {"summary": "Checkout outage 45min", "root_cause": "Bad deploy", "status": "draft"})'

  # --- publish_postmortem ---

  - type: call
    name: Exercise publish_postmortem on node 1
    node: foundation-node-1
    context_id: '{{incident_tracker_ctx}}'
    method: publish_postmortem
    args:
      postmortem_id: '{{postmortem_id}}'

  - type: wait_for_sync
    name: Wait for the publish to sync
    context_id: '{{incident_tracker_ctx}}'
    nodes: [foundation-node-1, foundation-node-2]
    timeout: 30
    trigger_sync: true

  - type: call
    name: Confirm postmortem published on node 2
    node: foundation-node-2
    context_id: '{{incident_tracker_ctx}}'
    method: list_postmortems
    args: {}
    outputs:
      postmortem_0_after_publish: result.output.0

  - type: json_assert
    name: publish_postmortem marks the postmortem published on node 2
    statements:
      - 'json_subset({{postmortem_0_after_publish}}, {"status": "published"})'
