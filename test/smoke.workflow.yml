# Two-node smoke test for the team-crm app's `crm` service.
#
# Exercises the parts an in-process test host can't cover: the bundle
# installed + a context created for the `crm` service, then every
# apiMethod from the spec exercised end-to-end on real nodes:
#   - add_contact / list_contacts (LwwRegister-backed shared Contact)
#   - create_deal / update_deal_stage / set_contract_details / list_deals
#     (shared Deal, pipeline-stage + contract-detail mutation replication)
#   - log_interaction / edit_interaction / delete_interaction /
#     list_interactions (AuthoredMap-backed Interaction lifecycle)
#
# Usage (run from the chat project root, after a dev bundle has been built):
#   merobox bootstrap run test/smoke.workflow.yml
#
# Pre-flight: `bash logic/build-bundle.sh` must have produced
# `logic/res/team-crm-1.0.0.mpk` (appName/appVersion from studio.config.json).

name: team-crm crm-service smoke
description: Verify the crm service replicates contacts, deals, and interactions across two nodes.
log_level: info
nodes:
  count: 2
  prefix: app-node
  # Pinned off `:edge` to a tag matching the SDK the logic pins
  # (0.11.0-rc.17). Bump in lockstep with logic/Cargo.toml's SDK tag, or
  # bootstrap skews. ASSUMPTION: ghcr publishes an image tag matching the
  # core git tag `0.11.0-rc.17`; if the registry uses a different naming
  # scheme, correct this tag (and verifierWorkflow.js).
  image: ghcr.io/calimero-network/merod:0.11.0-rc.17
  # High base ports to avoid colliding with a host-native merod on the
  # defaults (2428 P2P / 2528 RPC). Each node gets base + i.
  base_port: 12428      # P2P / swarm
  base_rpc_port: 12528  # JSON-RPC / admin API
nuke_on_start: true
nuke_on_end: true
wait_timeout: 90

steps:
  # --- Bootstrap application + namespace + crm context ---

  - type: install_application
    name: Install team-crm bundle on node 1
    node: app-node-1
    dev: true
    path: ./logic/res/team-crm-1.0.0.mpk
    outputs:
      app_id: applicationId

  - type: install_application
    name: Install team-crm bundle on node 2
    node: app-node-2
    dev: true
    path: ./logic/res/team-crm-1.0.0.mpk

  - type: create_namespace
    name: Create namespace on node 1
    node: app-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - type: create_context
    name: Create crm service context on node 1
    node: app-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    service_name: crm
    outputs:
      crm_ctx: contextId

  - type: create_namespace_invitation
    name: Issue namespace invitation
    node: app-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation: invitation

  - type: join_namespace
    name: Node 2 joins namespace
    node: app-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation}}'

  # --- Deterministic floor: parameterless views agree (empty) on both nodes ---

  - type: call
    name: List contacts from node 1 (floor)
    node: app-node-1
    context_id: '{{crm_ctx}}'
    method: list_contacts
    args: {}
    outputs:
      contacts_floor: result.output

  - type: json_assert
    name: Contacts list starts empty
    statements:
      - 'json_equal({{contacts_floor}}, [])'

  - type: call
    name: List deals from node 1 (floor)
    node: app-node-1
    context_id: '{{crm_ctx}}'
    method: list_deals
    args: {}
    outputs:
      deals_floor: result.output

  - type: json_assert
    name: Deals list starts empty
    statements:
      - 'json_equal({{deals_floor}}, [])'

  # --- add_contact / list_contacts ---

  - type: call
    name: Exercise add_contact on node 1
    node: app-node-1
    context_id: '{{crm_ctx}}'
    method: add_contact
    args:
      name: "Jane Doe"
      email: "jane@acme.com"
      phone: "555-0101"
      company: "Acme Co"
    outputs:
      contact_id: result.output

  - type: wait_for_sync
    name: Wait for sync after add_contact
    context_id: '{{crm_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30

  - type: call
    name: Confirm contact visible on node 2
    node: app-node-2
    context_id: '{{crm_ctx}}'
    method: list_contacts
    args: {}
    outputs:
      contact_0: result.output.0

  - type: json_assert
    name: add_contact produced a visible Contact on node 2
    statements:
      - 'json_subset({{contact_0}}, {"name": "Jane Doe", "email": "jane@acme.com", "company": "Acme Co"})'

  # --- create_deal / update_deal_stage / set_contract_details / list_deals ---

  - type: call
    name: Exercise create_deal on node 1
    node: app-node-1
    context_id: '{{crm_ctx}}'
    method: create_deal
    args:
      contact_id: '{{contact_id}}'
      title: "Acme renewal"
      value: 5000
    outputs:
      deal_id: result.output

  - type: wait_for_sync
    name: Wait for sync after create_deal
    context_id: '{{crm_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30

  - type: call
    name: Confirm deal visible on node 2
    node: app-node-2
    context_id: '{{crm_ctx}}'
    method: list_deals
    args: {}
    outputs:
      deal_0: result.output.0

  - type: json_assert
    name: create_deal produced a visible Deal on node 2
    statements:
      - 'json_subset({{deal_0}}, {"title": "Acme renewal", "value": 5000})'

  - type: call
    name: Exercise update_deal_stage on node 1
    node: app-node-1
    context_id: '{{crm_ctx}}'
    method: update_deal_stage
    args:
      deal_id: '{{deal_id}}'
      stage: "Proposal"

  - type: wait_for_sync
    name: Wait for sync after update_deal_stage
    context_id: '{{crm_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30

  - type: call
    name: Confirm updated stage visible on node 2
    node: app-node-2
    context_id: '{{crm_ctx}}'
    method: list_deals
    args: {}
    outputs:
      deal_after_stage: result.output.0

  - type: json_assert
    name: update_deal_stage produced the new stage on node 2
    statements:
      - 'json_subset({{deal_after_stage}}, {"stage": "Proposal"})'

  - type: call
    name: Exercise set_contract_details on node 1
    node: app-node-1
    context_id: '{{crm_ctx}}'
    method: set_contract_details
    args:
      deal_id: '{{deal_id}}'
      details: "Signed 12-mo contract, NET 30"

  - type: wait_for_sync
    name: Wait for sync after set_contract_details
    context_id: '{{crm_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30

  - type: call
    name: Confirm contract details visible on node 2
    node: app-node-2
    context_id: '{{crm_ctx}}'
    method: list_deals
    args: {}
    outputs:
      deal_after_contract: result.output.0

  - type: json_assert
    name: set_contract_details produced the details on node 2
    statements:
      - 'json_subset({{deal_after_contract}}, {"contract_details": "Signed 12-mo contract, NET 30"})'

  # --- log_interaction / edit_interaction / delete_interaction / list_interactions ---

  - type: call
    name: Exercise log_interaction on node 1
    node: app-node-1
    context_id: '{{crm_ctx}}'
    method: log_interaction
    args:
      contact_id: '{{contact_id}}'
      kind: "call"
      note: "Discussed renewal terms"
    outputs:
      interaction_id: result.output

  - type: wait_for_sync
    name: Wait for sync after log_interaction
    context_id: '{{crm_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30

  - type: call
    name: Confirm interaction visible on node 2
    node: app-node-2
    context_id: '{{crm_ctx}}'
    method: list_interactions
    args:
      contact_id: '{{contact_id}}'
    outputs:
      interaction_0: result.output.0

  - type: json_assert
    name: log_interaction produced a visible Interaction on node 2
    statements:
      - 'json_subset({{interaction_0}}, {"kind": "call", "note": "Discussed renewal terms"})'

  - type: call
    name: Exercise edit_interaction on node 1
    node: app-node-1
    context_id: '{{crm_ctx}}'
    method: edit_interaction
    args:
      id: '{{interaction_id}}'
      note: "Discussed renewal terms and pricing"

  - type: wait_for_sync
    name: Wait for sync after edit_interaction
    context_id: '{{crm_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30

  - type: call
    name: Confirm edited note visible on node 2
    node: app-node-2
    context_id: '{{crm_ctx}}'
    method: list_interactions
    args:
      contact_id: '{{contact_id}}'
    outputs:
      interaction_after_edit: result.output.0

  - type: json_assert
    name: edit_interaction produced the updated note on node 2
    statements:
      - 'json_subset({{interaction_after_edit}}, {"note": "Discussed renewal terms and pricing"})'

  - type: call
    name: Exercise delete_interaction on node 1
    node: app-node-1
    context_id: '{{crm_ctx}}'
    method: delete_interaction
    args:
      id: '{{interaction_id}}'

  - type: wait_for_sync
    name: Wait for sync after delete_interaction
    context_id: '{{crm_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30

  - type: call
    name: Confirm interaction removed on node 2
    node: app-node-2
    context_id: '{{crm_ctx}}'
    method: list_interactions
    args:
      contact_id: '{{contact_id}}'
    outputs:
      interactions_after_delete: result.output

  - type: json_assert
    name: delete_interaction leaves an empty interaction list on node 2
    statements:
      - 'json_equal({{interactions_after_delete}}, [])'
