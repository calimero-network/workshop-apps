name: team-todo smoke (generated)
description: Spec-derived two-node smoke for team-todo
log_level: info
nodes:
  count: 2
  prefix: app-node
  image: ghcr.io/calimero-network/merod:edge
  base_port: 12428
  base_rpc_port: 12528
nuke_on_start: true
nuke_on_end: true
wait_timeout: 90

steps:
  - type: install_application
    name: Install team-todo on app-node-1
    node: app-node-1
    dev: true
    path: ./logic/res/team-todo-0.1.0.mpk
    outputs:
      app_id: applicationId

  - type: install_application
    name: Install team-todo on app-node-2
    node: app-node-2
    dev: true
    path: ./logic/res/team-todo-0.1.0.mpk

  - type: create_namespace
    name: Create namespace on app-node-1
    node: app-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - type: create_namespace_invitation
    name: Issue namespace invitation
    node: app-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation: invitation

  - type: join_namespace
    name: app-node-2 joins namespace
    node: app-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation}}'

  - type: create_context
    name: Create todolist context on app-node-1
    node: app-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    service_name: todolist
    outputs:
      todolist_ctx: contextId

  - type: join_context
    name: app-node-2 joins todolist context
    node: app-node-2
    context_id: '{{todolist_ctx}}'

  - type: wait_for_sync
    name: Wait for todolist sync across both nodes
    context_id: '{{todolist_ctx}}'
    nodes: [app-node-1, app-node-2]
    timeout: 30

  - type: call
    name: View list_tasks from app-node-1
    node: app-node-1
    context_id: '{{todolist_ctx}}'
    method: list_tasks
    args: {}
    outputs:
      list_tasks_n1: result

  - type: call
    name: View list_tasks from app-node-2
    node: app-node-2
    context_id: '{{todolist_ctx}}'
    method: list_tasks
    args: {}
    outputs:
      list_tasks_n2: result

  - type: json_assert
    name: list_tasks agrees across nodes
    statements:
      - 'equal({{list_tasks_n1}}, {{list_tasks_n2}})'
